<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B7F5"/>
      <stop offset="55%" stop-color="#3E63E8"/>
      <stop offset="100%" stop-color="#8A35E8"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16B7F3"/>
      <stop offset="100%" stop-color="#633BE7"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->

  <!-- Speech bubble / voice ring -->
  <path d="M395 455
           C395 300 515 180 670 180
           C825 180 945 300 945 455
           C945 515 926 572 893 621"
        fill="none" stroke="url(#grad)" stroke-width="34" stroke-linecap="round"/>
  <path d="M893 621 L932 584" fill="none" stroke="url(#grad)" stroke-width="34" stroke-linecap="round"/>
  <path d="M395 455
           C395 540 433 612 494 665
           L438 690
           L460 623"
        fill="none" stroke="url(#grad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Microphone -->
  <rect x="535" y="270" width="150" height="285" rx="75" fill="url(#mic)"/>
  <path d="M500 470 V515 C500 605 570 660 610 660 C650 660 720 605 720 515 V470"
        fill="none" stroke="#0D1B46" stroke-width="30" stroke-linecap="round"/>
  <path d="M610 660 V720" fill="none" stroke="#0D1B46" stroke-width="30" stroke-linecap="round"/>
  <path d="M550 720 H670" fill="none" stroke="#0D1B46" stroke-width="30" stroke-linecap="round"/>

  <!-- Internal waveform -->
  <g fill="#fff">
    <rect x="555" y="398" width="15" height="38" rx="7"/>
    <rect x="578" y="365" width="17" height="104" rx="8"/>
    <rect x="603" y="330" width="17" height="175" rx="8"/>
    <rect x="628" y="370" width="17" height="100" rx="8"/>
    <rect x="653" y="400" width="15" height="36" rx="7"/>
  </g>
  <g fill="#fff">
    <circle cx="540" cy="418" r="7"/>
    <circle cx="683" cy="418" r="7"/>
  </g>

  <!-- Outgoing sound wave -->
  <g fill="url(#grad)">
    <rect x="750" y="398" width="22" height="105" rx="11"/>
    <rect x="792" y="345" width="22" height="212" rx="11"/>
    <rect x="834" y="300" width="22" height="300" rx="11"/>
    <rect x="876" y="360" width="22" height="180" rx="11"/>
    <circle cx="930" cy="450" r="12"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="850" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="190" font-weight="700" letter-spacing="-8"
        fill="#0D1B46">Soni<tspan fill="url(#grad)">q</tspan></text>

  <!-- Tagline -->
  <text x="600" y="925" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="30" font-weight="500" letter-spacing="7"
        fill="#263457">AI VOICE, LIMITLESS POSSIBILITIES</text>

  <!-- AI divider -->
  <line x1="420" y1="990" x2="535" y2="990" stroke="#10B7F5" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="1003" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="42" font-weight="600" fill="url(#grad)">AI</text>
  <line x1="665" y1="990" x2="780" y2="990" stroke="#8A35E8" stroke-width="6" stroke-linecap="round"/>
</svg>